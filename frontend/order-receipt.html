<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#28351f">
    <title>KANAAN</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Apply the saved language before first paint (avoids an RTL/LTR flash) -->
    <script>
        try {
            var lang = localStorage.getItem('kn_lang') === 'en' ? 'en' : 'ar';
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
    </script>
</head>

<body data-page="receipt">
    <div id="site-header"></div>

    <main id="app">
        <div class="container loading">...</div>
    </main>

    <div id="site-footer"></div>

    <noscript>JavaScript is required / يتطلب تفعيل جافاسكربت</noscript>

    <script src="assets/js/app.js"></script>
</body>
</html>
