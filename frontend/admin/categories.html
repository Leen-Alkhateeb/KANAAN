<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f3f5f0">

    <title>KANAAN Admin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Admin CSS -->
    <link rel="stylesheet" href="../assets/css/admin.css">

    <!-- Load saved language -->
    <script>
        (function () {
            try {
                const lang = localStorage.getItem('kn_lang') === 'en' ? 'en' : 'ar';
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            } catch (error) {
                document.documentElement.lang = 'ar';
                document.documentElement.dir = 'rtl';
            }
        })();
    </script>
</head>

<body class="admin-body">

    <!-- Admin Application Root -->
    <div id="admin-root"></div>

    <!-- Toast Notification Container (لحفظ رسائل النجاح والخطأ العائمة) -->
    <div id="a-toast" role="status" aria-live="polite"></div>

    <noscript>
        JavaScript is required / يتطلب تفعيل JavaScript
    </noscript>

    <!-- Admin JavaScript -->
    <script src="../assets/js/admin.js"></script>

</body>
</html>
